services:
  nginx:
    image: nginx:1.30.1-alpine-slim
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app
    restart: always

  app:
    image: ghcr.io/mingdodev/ttalkkak-notify:latest
    expose:
      - "8080"
    env_file:
      - .env
    volumes:
      - ./config/user_mapping.yml:/app/config/user_mapping.yml:ro
    restart: always
