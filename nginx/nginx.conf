server {
    listen 80;
    server_name ttalkkak.o-r.kr;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name ttalkkak.o-r.kr;

    ssl_certificate     /etc/letsencrypt/live/ttalkkak.o-r.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ttalkkak.o-r.kr/privkey.pem;

    location /webhook/ {
        proxy_pass         http://app:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location / {
        return 444;
    }
}
